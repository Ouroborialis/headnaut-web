	<script>
    (function() {
        var game = new gdjs.RuntimeGame(gdjs.projectData, {});
        window.headSpaceGame = game;

        var launchParams = new URLSearchParams(window.location.search);
        try {
            var savedCharacterIndex = Number(
                localStorage.getItem("headspace-selected-character-index")
            );
            var savedHelmetIndex = Number(
                localStorage.getItem("headspace-selected-helmet-index")
            );
            if (Number.isFinite(savedCharacterIndex)) {
                game.getVariables().getFromIndex(0).setNumber(
                    Math.max(0, Math.min(10, Math.round(savedCharacterIndex)))
                );
            }
            if (Number.isFinite(savedHelmetIndex)) {
                game.getVariables().getFromIndex(1).setNumber(
                    Math.max(0, Math.min(17, Math.round(savedHelmetIndex)))
                );
            }
        } catch (error) {
            // Private browsing can disable storage; the game's authored defaults remain valid.
        }
        var requestedLevelValue = launchParams.get("level");
        if (requestedLevelValue !== null) {
            var requestedLevel = Number(requestedLevelValue);
            if (Number.isFinite(requestedLevel)) {
                game.getVariables().get("CurrentLevel").setNumber(requestedLevel);
            }
        }
        var requestedMultiplayerValue = launchParams.get("multiplayer");
        if (requestedMultiplayerValue !== null) {
            var multiplayerRequested =
                requestedMultiplayerValue === "1" ||
                requestedMultiplayerValue.toLowerCase() === "true";
            game.getVariables().get("MultiplayerMode").setBoolean(multiplayerRequested);
            if (multiplayerRequested) {
                var requestedPlayerCount = Number(launchParams.get("players"));
                game.getVariables().get("MultiplayerPlayerCount").setNumber(
                    Number.isFinite(requestedPlayerCount)
                        ? Math.max(1, Math.min(4, Math.round(requestedPlayerCount)))
                        : 1
                );
                var requestedGameMode = launchParams.get("mode");
                game.getVariables().get("MultiplayerGameMode").setString(
                    requestedGameMode === "hunt-the-boss"
                        ? "hunt-the-boss"
                        : "head-to-head"
                );
            }
        }
        if (
            launchParams.has("level") ||
            launchParams.has("multiplayer") ||
            launchParams.has("players") ||
            launchParams.has("mode")
        ) {
            var cleanParams = new URLSearchParams(window.location.search);
            cleanParams.delete("level");
            cleanParams.delete("multiplayer");
            cleanParams.delete("players");
            cleanParams.delete("mode");
            var cleanQuery = cleanParams.toString();
            window.history.replaceState(
                null,
                "",
                window.location.pathname + (cleanQuery ? "?" + cleanQuery : "")
            );
        }

        game.getRenderer().createStandardCanvas(document.body);
        game.getRenderer().bindStandardEvents(game.getInputManager(), window, document);
        game.loadAllAssets(function() {
            game.startGameLoop();
        });
    })();

	</script>
</body>
</html>
