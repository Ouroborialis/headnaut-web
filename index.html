			display: none;

			bottom: max(12px, env(safe-area-inset-bottom));
			transform: translateX(-50%);
			min-width: 210px;
			min-height: 48px;
			padding: 8px 18px;
			border: 2px solid #45d7ff;
			border-radius: 10px;
			background: rgba(1,9,20,.92);

<body>

    
	<script>
    (function() {
        var game = new gdjs.RuntimeGame(gdjs.projectData, {});
        window.headSpaceGame = game;

		var orientationGate = document.createElement("div");
		orientationGate.id = "headspace-mobile-orientation";
		orientationGate.innerHTML = '<div class="phone-icon" aria-hidden="true">&#128241;</div><strong>ROTATE YOUR PHONE</strong><span>HEADNAUT plays in landscape mode.</span>';
		document.body.appendChild(orientationGate);
		var fullscreenButton = document.createElement("button");
		fullscreenButton.id = "headspace-mobile-fullscreen";
		fullscreenButton.type = "button";
		fullscreenButton.textContent = "TAP FOR FULLSCREEN";
		document.body.appendChild(fullscreenButton);
		var isTouchDevice = navigator.maxTouchPoints > 0 || window.matchMedia("(pointer: coarse)").matches;
		var updateMobilePresentation = function () {
			var viewport = window.visualViewport;
			var width = viewport ? viewport.width : window.innerWidth;
			var height = viewport ? viewport.height : window.innerHeight;
			var portrait = height > width;
			orientationGate.style.display = isTouchDevice && portrait ? "flex" : "none";
			fullscreenButton.style.display = isTouchDevice && !portrait && !document.fullscreenElement ? "block" : "none";
		};
		fullscreenButton.addEventListener("click", async function (event) {
			event.preventDefault();
			event.stopPropagation();
			try {
				await document.documentElement.requestFullscreen?.({ navigationUI: "hide" });
				await window.screen?.orientation?.lock?.("landscape");
			} catch (error) {
				// Some mobile browsers only hide their chrome after a scroll or do
				// not expose the fullscreen API. The responsive canvas still works.
			}
			updateMobilePresentation();
		});
		document.addEventListener("fullscreenchange", updateMobilePresentation);

		// Mobile browser chrome changes the usable viewport independently from
		// window.innerHeight. Notify GDevelop after both viewport resizing and
		// physical orientation changes so its landscape canvas is recalculated
		// instead of retaining the dimensions from initial page load.
		var mobileViewportResizeTimer = 0;
		var refitGameToMobileViewport = function () {
			window.clearTimeout(mobileViewportResizeTimer);
			mobileViewportResizeTimer = window.setTimeout(function () {
				document.documentElement.style.height = "100dvh";
				document.body.style.height = "100dvh";
				game.onWindowInnerSizeChanged();
				updateMobilePresentation();
			}, 80);
		};
		window.addEventListener("resize", refitGameToMobileViewport, { passive: true });
		window.addEventListener("orientationchange", function () {
			refitGameToMobileViewport();
			window.setTimeout(refitGameToMobileViewport, 300);
		}, { passive: true });
		window.visualViewport?.addEventListener("resize", refitGameToMobileViewport, { passive: true });
		window.screen?.orientation?.addEventListener?.("change", refitGameToMobileViewport);
		updateMobilePresentation();

        var launchParams = new URLSearchParams(window.location.search);
        try {
            var savedCharacterIndex = Number(
                localStorage.getItem("headspace-selected-character-index")
            );
            var savedHelmetIndex = Number(
                localStorage.getItem("headspace-selected-helmet-index")
            );
            if (Number.isFinite(savedCharacterIndex)) {
                game.getVariables().getFromIndex(0).setNumber(
                    Math.max(0, Math.min(10, Math.round(savedCharacterIndex)))
                );
            }
            if (Number.isFinite(savedHelmetIndex)) {
                game.getVariables().getFromIndex(1).setNumber(
                    Math.max(0, Math.min(17, Math.round(savedHelmetIndex)))
                );
            }
        } catch (error) {
            // Private browsing can disable storage; the game's authored defaults remain valid.
        }
        var requestedLevelValue = launchParams.get("level");
        if (requestedLevelValue !== null) {
            var requestedLevel = Number(requestedLevelValue);
            if (Number.isFinite(requestedLevel)) {
                game.getVariables().get("CurrentLevel").setNumber(requestedLevel);
            }
        }
        var requestedMultiplayerValue = launchParams.get("multiplayer");
        if (requestedMultiplayerValue !== null) {
            var multiplayerRequested =
                requestedMultiplayerValue === "1" ||
                requestedMultiplayerValue.toLowerCase() === "true";
            game.getVariables().get("MultiplayerMode").setBoolean(multiplayerRequested);
            if (multiplayerRequested) {
                var requestedPlayerCount = Number(launchParams.get("players"));
                game.getVariables().get("MultiplayerPlayerCount").setNumber(
                    Number.isFinite(requestedPlayerCount)
                        ? Math.max(1, Math.min(4, Math.round(requestedPlayerCount)))
                        : 1
                );
                var requestedGameMode = launchParams.get("mode");
                game.getVariables().get("MultiplayerGameMode").setString(
                    requestedGameMode === "hunt-the-boss"
                        ? "hunt-the-boss"
                        : "head-to-head"
                );
            }
        }
        if (
            launchParams.has("level") ||
            launchParams.has("multiplayer") ||
            launchParams.has("players") ||
            launchParams.has("mode")
        ) {
            var cleanParams = new URLSearchParams(window.location.search);
            cleanParams.delete("level");
            cleanParams.delete("multiplayer");
            cleanParams.delete("players");
            cleanParams.delete("mode");
            var cleanQuery = cleanParams.toString();
            window.history.replaceState(
                null,
                "",
                window.location.pathname + (cleanQuery ? "?" + cleanQuery : "")
            );
        }

        game.getRenderer().createStandardCanvas(document.body);
        game.getRenderer().bindStandardEvents(game.getInputManager(), window, document);
        game.loadAllAssets(function() {
            game.startGameLoop();
        });
    })();

	</script>
